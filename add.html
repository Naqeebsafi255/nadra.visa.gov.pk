<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New Visa | Naqeeb System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<style>
    body { font-size: 15px; }
    label { font-size: 14px !important; font-weight: 600 !important; color: #1a1a1a !important; }
    input, select { font-size: 14px !important; color: #111 !important; }
    .section-title {
        font-size: 13px;
        font-weight: 700;
        color: #0b6b3a;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid #0b6b3a;
        padding-bottom: 4px;
        margin-bottom: 12px;
    }
</style>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#0b6b3a',
            }
        }
    }
}
</script>
</head>
<body class="bg-gray-100 min-h-screen py-6">

<div class="container mx-auto px-4 max-w-5xl">
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">

        <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-primary">
            <h2 class="text-2xl font-bold text-primary flex items-center gap-2">
                <i class="fa fa-user-plus"></i> Add New Visa Record
            </h2>
            <a href="admin_dashboard.html" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                <i class="fa fa-arrow-left"></i> Back
            </a>
        </div>

        <div id="message-container"></div>

        <form id="addVisaForm" onsubmit="submitVisaForm(event)" class="space-y-6">

            <!-- REFERENCE & NAME -->
            <div>
                <p class="section-title"><i class="fa fa-id-card"></i> Basic Information</p>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1">Reference Number (Auto / Editable) <span class="text-red-500">*</span></label>
                        <input type="text" id="visa_reference_number" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary font-bold text-lg text-primary" placeholder="Enter or keep auto reference">
                    </div>
                    <div>
                        <label class="block mb-1">Full Name <span class="text-red-500">*</span></label>
                        <input type="text" id="full_name" placeholder="Full Name as in Passport" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                </div>
            </div>

            <!-- PASSPORT -->
            <div>
                <p class="section-title"><i class="fa fa-book"></i> Passport Details</p>
                <div class="grid md:grid-cols-3 gap-4">
                    <div>
                        <label class="block mb-1">Passport No <span class="text-red-500">*</span></label>
                        <input type="text" id="passport_no" placeholder="Passport Number" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block mb-1">Passport Country <span class="text-red-500">*</span></label>
                        <input type="text" id="passport_country" placeholder="e.g. Afghanistan" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block mb-1">Nationality <span class="text-red-500">*</span></label>
                        <input type="text" id="nationality" placeholder="e.g. Afghan" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                </div>
            </div>

            <!-- DOB + GENDER -->
            <div>
                <p class="section-title"><i class="fa fa-user"></i> Personal Details</p>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1">Date of Birth <span class="text-red-500">*</span></label>
                        <input type="date" id="dob" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block mb-1">Gender <span class="text-red-500">*</span></label>
                        <div class="flex gap-4 mt-1">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="sex" value="M" class="hidden peer" checked>
                                <div class="peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 border-2 border-gray-300 rounded-lg py-2.5 flex items-center justify-center gap-2 text-gray-600 font-semibold transition-all hover:border-blue-400">
                                    <i class="fa fa-male text-lg"></i> Male
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="sex" value="F" class="hidden peer">
                                <div class="peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 border-2 border-gray-300 rounded-lg py-2.5 flex items-center justify-center gap-2 text-gray-600 font-semibold transition-all hover:border-pink-400">
                                    <i class="fa fa-female text-lg"></i> Female
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VISA DETAILS -->
            <div>
                <p class="section-title"><i class="fa fa-file-text"></i> Visa Details</p>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1">Visa Category <span class="text-red-500">*</span></label>
                        <select id="visa_category" required class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                            <option value="">-- Select Category --</option>
                            <option value="Tourist/Visa">Tourist/Visit</option>
                            <option value="Business">Business</option>
                            <option value="Work">Work</option>
                            <option value="Medical">Medical</option>
                            <option value="Student">Study</option>
                            <option value="Family Visa">Family Visit</option>
                            <option value="Diplomatic Visa">Diplomatic / Official</option>
                            <option value="Transit Visa">Transit/Visa</option>
                            <option value="Refugee">Refugee / Humanitarian</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">Visa Sub Category <span class="text-red-500">*</span></label>
                        <select id="visa_sub_category" required class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                            <option value="">-- Select Sub Category --</option>
                            <option value="Individual (less Than 3 Months)">Individual (less Than 3 Months)</option>
                            <option value="Individual">Individual</option>
                            <option value="Transit/Transport(entry)">Transit/Transport(entry)</option>
                            <option value="General">General</option>
                            <option value="Family Visit">Family Visit</option>
                            <option value="Short-Term">Short-Term</option>
                            <option value="Group Entry">Group Entry - Single Visit</option>
                            <option value="Emergency Entry">Emergency Entry - Short Stay</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- APPLICATION -->
            <div>
                <p class="section-title"><i class="fa fa-calendar"></i> Application Info</p>
                <div class="grid md:grid-cols-3 gap-4">
                    <div>
                        <label class="block mb-1">Application Type <span class="text-red-500">*</span></label>
                        <select id="application_type" required class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                            <option value="">-- Select Type --</option>
                            <option value="Entry">Entry</option>
                            <option value="Extension">Extension</option>
                            <option value="Renewal">Renewal</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">Application Date <span class="text-red-500">*</span></label>
                        <input type="date" id="application_date" required
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block mb-1">Visa Grant Date</label>
                        <input type="date" id="visa_grant_date"
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                </div>
            </div>

            <!-- VALIDITY -->
            <div>
                <p class="section-title"><i class="fa fa-clock-o"></i> Validity</p>
                <div class="grid md:grid-cols-3 gap-4">
                    <div>
                        <label class="block mb-1">Start Date</label>
                        <input type="date" id="visa_start_date"
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block mb-1">End Date</label>
                        <input type="date" id="visa_end_date"
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block mb-1">Duration</label>
                        <input type="text" id="visa_duration" placeholder="e.g. 30 Days / 1 Year"
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                    </div>
                </div>
            </div>

            <!-- OTHER -->
            <div>
                <p class="section-title"><i class="fa fa-cog"></i> Other Details</p>
                <div class="grid md:grid-cols-3 gap-4">
                    <div>
                        <label class="block mb-1">Status <span class="text-red-500">*</span></label>
                        <select id="status" required class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">Stay / Facility <span class="text-red-500">*</span></label>
                        <select id="staying_facility" required class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none focus:border-primary">
                            <option value="">-- Select Option --</option>
                            <option value="Single Entry">Single Entry</option>
                            <option value="Multiple Entry - Upto 1 Year">Multiple Entry - Upto 1 Year</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">Upload Photo (Optional)</label>
                        <input type="file" id="photo" accept="image/*"
                               class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg outline-none">
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-primary hover:bg-green-800 text-white font-bold py-3 rounded-lg transition text-lg flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa fa-plus-circle"></i> Save New Visa Record
            </button>

        </form>

        <br>
        <a href="admin_dashboard.html" class="text-sm font-medium text-primary hover:underline">
            ⬅ Back to Dashboard
        </a>
    </div>
</div>

<script>
    // خپل د Supabase پته او Anon Key دلته ولیکئ
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // د اتوماتیک ریفرنس نمبر جوړول
    function generateAutoRef() {
        const randomNum = Math.floor(1000000 + Math.random() * 9000000);
        document.getElementById('visa_reference_number').value = "8800" + randomNum;
    }

    window.onload = generateAutoRef;

    // د فورم د لېږلو او ډاتابیس ته د سیو کولو فنکشن
    async function submitVisaForm(event) {
        event.preventDefault();

        let ref = document.getElementById('visa_reference_number').value.trim();
        let name = document.getElementById('full_name').value.trim();
        let dob = document.getElementById('dob').value;
        let passport = document.getElementById('passport_no').value.trim();
        let country = document.getElementById('passport_country').value.trim();
        let nation = document.getElementById('nationality').value.trim();
        let cat = document.getElementById('visa_category').value;
        let subcat = document.getElementById('visa_sub_category').value;
        let type = document.getElementById('application_type').value;
        let grant = document.getElementById('visa_grant_date').value || null;
        let stay = document.getElementById('staying_facility').value;
        let start = document.getElementById('visa_start_date').value || null;
        let end = document.getElementById('visa_end_date').value || null;
        let duration = document.getElementById('visa_duration').value.trim();
        let status = document.getElementById('status').value;
        let appdate = document.getElementById('application_date').value;
        let sex = document.querySelector('input[name="sex"]:checked').value;

        let messageContainer = document.getElementById('message-container');

        // ډاتابیس ته د معلوماتو استول
        const { data, error } = await supabaseClient
            .from('visa_records1_new')
            .insert([
                {
                    visa_reference_number: ref,
                    full_name: name,
                    dob: dob,
                    passport_no: passport,
                    passport_country: country,
                    nationality: nation,
                    visa_category: cat,
                    visa_sub_category: subcat,
                    application_type: type,
                    visa_grant_date: grant,
                    staying_facility: stay,
                    visa_start_date: start,
                    visa_end_date: end,
                    visa_duration: duration,
                    status: status,
                    application_date: appdate,
                    sex: sex
                }
            ]);

        if (error) {
            messageContainer.innerHTML = `<div class='bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4'>❌ Error: ${error.message}</div>`;
        } else {
            messageContainer.innerHTML = `<div class='bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4'>✔ New Visa Record Added Successfully!</div>`;
            document.getElementById('addVisaForm').reset();
            generateAutoRef(); // نوی اتوماتیک نمبر جوړول
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
</script>

</body>
</html>
