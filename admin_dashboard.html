<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Management Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#15803d',
                        primaryDark: '#166534',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<header class="bg-gradient-to-r from-primary to-primaryDark text-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-passport text-xl"></i>
            <h1 class="text-lg md:text-xl font-bold">Naqeeb Safi Visa System</h1>
        </div>
        <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-sm transition-all cursor-pointer">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span class="hidden sm:inline">Logout</span>
        </button>
    </div>
</header>

<!-- Main Content -->
<main class="container mx-auto px-3 py-5">

    <!-- Top Bar -->
    <div class="bg-white rounded-lg shadow p-4 mb-5">
        <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
            <a href="add.html" class="bg-primary hover:bg-primaryDark text-white px-4 py-2 rounded-lg flex items-center gap-2 font-medium transition-all text-center justify-center">
                <i class="fa-solid fa-plus"></i> Add New Visa
            </a>

            <div class="flex flex-1 max-w-xl gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search Name, Ref or Passport..." onkeyup="filterRecords()"
                           class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all">
                </div>
                <button onclick="fetchVisaRecords()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all">Search</button>
                <button onclick="clearSearch()" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded-lg transition-all" title="Clear Search">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Records Table -->
    <div class="bg-white rounded-lg shadow p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
                <i class="fa-solid fa-list-check text-primary"></i> Visa Records
            </h2>
            <span class="text-sm text-gray-500">Total: <strong id="totalCount" class="text-primary">0</strong></span>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-primary text-white">
                    <tr>
                        <th class="p-3 text-left">#</th>
                        <th class="p-3 text-left">Reference No</th>
                        <th class="p-3 text-left">Full Name</th>
                        <th class="p-3 text-left">Passport No</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-200">
                    <!-- معلومات به دلته د جاواسکریپټ له لارې راځي -->
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- Footer -->
<footer class="bg-gray-800 text-gray-300 py-4 mt-8">
    <div class="container mx-auto px-4 text-center text-sm">
        <p>© 2026 Naqeeb Safi Visa Management System | All Rights Reserved</p>
    </div>
</footer>

<!-- JavaScript for Supabase Integration -->
<script>
    // دلته خپل د Supabase پته او Anon Key ځای پر ځای کړئ
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allRecords = [];

    // د معلوماتو راایستل له Supabase څخه
    async function fetchVisaRecords() {
        const { data, error } = await supabaseClient
            .from('visa_records1_new')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error('Error fetching data:', error);
            alert('د ډاتابیس په نښلولو کې ستونزه ده!');
            return;
        }

        allRecords = data;
        displayRecords(allRecords);
    }

    // په جدول کې د معلوماتو ښودل
    function displayRecords(records) {
        let tableBody = document.getElementById('table-body');
        let totalCount = document.getElementById('totalCount');
        tableBody.innerHTML = '';
        totalCount.innerText = records.length;

        if (records.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="p-8 text-center text-gray-500">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 opacity-50"></i>
                        <p class="font-medium">No records found</p>
                    </td>
                </tr>`;
            return;
        }

        records.forEach((row, index) => {
            let tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-colors";
            tr.innerHTML = `
                <td class="p-3 font-medium">${index + 1}</td>
                <td class="p-3 font-mono">${row.visa_reference_number || ''}</td>
                <td class="p-3">${row.full_name || ''}</td>
                <td class="p-3 font-mono">${row.passport_no || ''}</td>
                <td class="p-3">
                    <div class="flex flex-wrap gap-1.5 justify-center">
                        <button onclick="editRecord(${row.id})" class="bg-yellow-500 hover:bg-yellow-600 text-black px-2.5 py-1 rounded text-xs transition-all cursor-pointer" title="Edit Record">
                            <i class="fa-solid fa-pen-to-square"></i> Edit
                        </button>
                        <button onclick="deleteRecord(${row.id})" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded text-xs transition-all cursor-pointer" title="Delete Record">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // د لټون (Search) فنکشن
    function filterRecords() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allRecords.filter(row => 
            (row.full_name && row.full_name.toLowerCase().includes(query)) ||
            (row.visa_reference_number && row.visa_reference_number.toLowerCase().includes(query)) ||
            (row.passport_no && row.passport_no.toLowerCase().includes(query))
        );
        displayRecords(filtered);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        displayRecords(allRecords);
    }

    // د ریکارډ د له منځه وړلو (Delete) فنکشن
    async function deleteRecord(id) {
        if (confirm('Are you sure you want to delete this record?')) {
            const { error } = await supabaseClient
                .from('visa_records1_new')
                .delete()
                .eq('id', id);

            if (error) {
                alert('د پاکولو پر مهال خطا شوه: ' + error.message);
            } else {
                fetchVisaRecords(); // جدول تازه کول
            }
        }
    }

    // د ایډیټ کولو لپاره بلې پاڼې ته تګ
    function editRecord(id) {
        window.location.href = `editvisa.html?id=${id}`;
    }

    // د وتلو (Logout) فنکشن
    function logout() {
        window.location.href = "index.html";
    }

    // کله چې پاڼه خلاصه شي، معلومات راوباسي
    window.onload = fetchVisaRecords;
</script>

</body>
</html>
