<script>
    // Supabase پته او Anon Key
    const SUPABASE_URL = 'https://bwciadrnuxjowqgaflgu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y2lhZHJudXhqb3dxZ2FmbGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzc1NTUsImV4cCI6MjEwMTg1MzU1NX0.B4J7D4Iii5lpEE9NPI1t9BAdXzWaHmJY7touKd-usO4';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadVerificationDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedId = urlParams.get('r');

        if (!encodedId) {
            alert('Invalid Request: Record not specified.');
            window.location.href = 'admin_dashboard.html';
            return;
        }

        try {
            // د base64 څخه د آډي (id) خلاصول
            const recordId = atob(encodedId);

            const { data, error } = await supabaseClient
                .from('visa_records1_new')
                .select('*')
                .eq('id', recordId)
                .single();

            if (error || !data) {
                alert('Visa Not Found or Invalid QR Code!');
                return;
            }

            // نیټې د ډیسک پاتې کیدو لپاره فارمیټ کول
            function formatDate(dateString) {
                if (!dateString) return '';
                let d = new Date(dateString);
                if (isNaN(d)) return dateString;
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
            }

            // معلومات په پاڼه کې اچول
            document.getElementById('v_ref').innerText = data.visa_reference_number || '';
            document.getElementById('v_name').innerText = data.full_name || '';
            document.getElementById('v_passport').innerText = data.passport_no || '';
            document.getElementById('v_country').innerText = data.passport_country || '';
            document.getElementById('v_category').innerText = data.visa_category || '';
            document.getElementById('v_subcategory').innerText = data.visa_sub_category || '';
            document.getElementById('v_apptype').innerText = data.application_type || '';
            document.getElementById('v_facility').innerText = data.staying_facility || '';
            document.getElementById('v_duration').innerText = data.duration || '';
            document.getElementById('v_start').innerText = formatDate(data.start_date);
            document.getElementById('v_end').innerText = formatDate(data.end_date);

            // عکس له Supabase Storage (photo bucket) څخه راایستل
            if (data.photo && data.photo.trim() !== "") {
                const { data: publicUrlData } = supabaseClient.storage
                    .from('photo')
                    .getPublicUrl(data.photo);
                
                if (publicUrlData && publicUrlData.publicUrl) {
                    let photoEl = document.getElementById('v_photo');
                    photoEl.src = publicUrlData.publicUrl;
                    photoEl.style.display = "block";
                }
            }

        } catch (err) {
            console.error('Error loading verification:', err);
            alert('Error verifying visa details.');
        } finally {
            // لوډر بندول
            setTimeout(function() {
                document.getElementById("loader").style.display = "none";
            }, 1000);
        }
    }

    window.onload = loadVerificationDetails;
</script>
