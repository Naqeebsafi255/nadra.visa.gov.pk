    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style type="text/css">
        body {
            font: 14px/24px "Poppins", sans-serif !important;
            background-color: #fff;
            color: #666666;
        }
        .preview__header {
            font-size: 12px;
            min-height: 35px;
            background-color: #44aa68;
            z-index: 100;
            color: #fff;
        }
        .label-div { text-align: left; }
        .value-div { text-align: left; }
        @media (max-width: 991px) {
            .label-div { text-align: center; }
            .value-div { text-align: center; }
        }
        
        /* Preloader */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-effect-2 {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .loading-effect-2 span {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        .loading-effect-2 span:nth-child(1) {
            width: 100px;
            height: 100px;
            border-top: 2.5px solid #1f6fa5;
            border-right: 2.5px solid #1f6fa5;
            border-bottom: 2.5px solid #1f6fa5;
            border-left: 2.5px solid transparent;
            animation: spin 3s linear infinite;
        }
        .loading-effect-2 span:nth-child(2) {
            width: 70px;
            height: 70px;
            top: 15px;
            left: 15px;
            border-top: 2.5px solid #1f6fa5;
            border-right: 2.5px solid #1f6fa5;
            border-bottom: 2.5px solid #1f6fa5;
            border-left: 2.5px solid transparent;
            animation: spinReverse 2.5s linear infinite;
        }
        .loading-effect-2 span:nth-child(3) {
            width: 40px;
            height: 40px;
            top: 30px;
            left: 30px;
            border-top: 2.5px solid #1f6fa5;
            border-right: 2.5px solid #1f6fa5;
            border-bottom: 2.5px solid #1f6fa5;
            border-left: 2.5px solid transparent;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
        .boxed { background: #fff; min-height: 100vh; }
        .header { background: #fff; border-bottom: 1px solid #eee; padding: 10px 0; }
        .post { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.05); margin-top: 30px; }
    </style>
</head>
<body>

            <span></span>

    </div>

    <div class="boxed">

        </header>

        <section class="flat-row" style="margin-top: 40px;">
            <div class="container">
                <div class="row pd-contact-v2">

                        <article class="post style2">

<script>
    const SUPABASE_URL = 'https://bwciadrnuxjowqgaflgu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y2lhZHJudXhqb3dxZ2FmbGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzc1NTUsImV4cCI6MjEwMTg1MzU1NX0.B4J7D4Iii5lpEE9NPI1t9BAdXzWaHmJY7touKd-usO4';

    async function loadVerificationDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedId = urlParams.get('r');

        if (!encodedId) {
            alert('Invalid Request: Record not specified.');
            window.location.href = 'admin_dashboard.html';
            return;
        }

        try {
            const recordId = atob(encodedId);

            // Direct REST API call (No client storage blocking issues)
            const response = await fetch(`${SUPABASE_URL}/rest/v1/visa_records1_new?id=eq.${recordId}&select=*`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });

            const result = await response.json();

            if (!result || result.length === 0) {
                alert('Visa Not Found or Invalid QR Code!');
                document.getElementById("loader").style.display = "none";
                return;
            }

            const data = result[0];

            function formatDate(dateString) {
                if (!dateString) return '';
                let d = new Date(dateString);
                if (isNaN(d)) return dateString;
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
            }

            document.getElementById('v_ref').innerText = data.visa_reference_number || '';
            document.getElementById('v_name').innerText = data.full_name || '';
            document.getElementById('v_passport').innerText = data.passport_no || '';
            document.getElementById('v_country').innerText = data.passport_country || '';
            document.getElementById('v_category').innerText = data.visa_category || '';
            document.getElementById('v_subcategory').innerText = data.visa_sub_category || '';
            document.getElementById('v_apptype').innerText = data.application_type || '';
            document.getElementById('v_facility').innerText = data.staying_facility || '';
            document.getElementById('v_duration').innerText = data.duration || '';
            document.getElementById('v_start').innerText = formatDate(data.start_date);
            document.getElementById('v_end').innerText = formatDate(data.end_date);

            if (data.photo && data.photo.trim() !== "") {
                const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photo/${data.photo}`;
                let photoEl = document.getElementById('v_photo');
                photoEl.src = photoUrl;
                photoEl.style.display = "block";
            }

        } catch (err) {
            console.error('Error loading verification:', err);
            alert('Error verifying visa details.');
        } finally {
            document.getElementById("loader").style.display = "none";
        }
    }

    window.onload = loadVerificationDetails;
</script>

</body>
