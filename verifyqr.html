    <style type="text/css">
        body {
            font: 14px/24px "Poppins", sans-serif !important;
            background-color: #fff;
            color: #666666;
        }
        .preview__header {
            font-size: 12px;
            min-height: 35px;
            background-color: #44aa68;
            z-index: 100;
            color: #fff;
        }
        .label-div { text-align: left; }
        .value-div { text-align: left; }
        @media (max-width: 991px) {
            .label-div { text-align: center; }
            .value-div { text-align: center; }
        }
        
        /* Preloader Styles (3 Layers) */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-effect-2 {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .loading-effect-2 span {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        /* Outer */
        .loading-effect-2 span:nth-child(1) {
            width: 100px;
            height: 100px;
            border-top: 2.5px solid #1f6fa5;
            border-right: 2.5px solid #1f6fa5;
            border-bottom: 2.5px solid #1f6fa5;
            border-left: 2.5px solid transparent;
            animation: spin 3s linear infinite;
        }
        /* Middle */
        .loading-effect-2 span:nth-child(2) {
            width: 70px;
            height: 70px;
            top: 15px;
            left: 15px;
            border-top: 2.5px solid #1f6fa5;
            border-right: 2.5px solid #1f6fa5;
            border-bottom: 2.5px solid #1f6fa5;
            border-left: 2.5px solid transparent;
            animation: spinReverse 2.5s linear infinite;
        }
        /* Inner */
        .loading-effect-2 span:nth-child(3) {
            width: 40px;
            height: 40px;
            top: 30px;
            left: 30px;
            border-top: 2.5px solid #1f6fa5;
            border-right: 2.5px solid #1f6fa5;
            border-bottom: 2.5px solid #1f6fa5;
            border-left: 2.5px solid transparent;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Custom Nav Menu */
        .nav-menu {
            float: right;
            margin-top: 15px;
        }
        .nav-menu a {
            color: #333;
            font-weight: 600;
            margin-left: 20px;
            text-decoration: none;
            font-size: 15px;
        }
        .nav-menu a:hover {
            color: #1f6fa5;
        }
    </style>
</head>

<script>

        }, 3000);
    });
</script>
