<script>

    const menuBtn = document.getElementById('mobileMenuBtn');
    const mainNav = document.getElementById('mainnav');
    
    if (menuBtn && mainNav) {
        menuBtn.addEventListener('click', function () {
            mainNav.classList.toggle('active');
        });
    }
});

<!-- ستاسو د پاتې کوډ لاندې دلته راشي -->
<script>
    const SUPABASE_URL = 'https://bwciadrnuxjowqgaflgu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y2lhZHJudXhqb3dxZ2FmbGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzc1NTUsImV4cCI6MjEwMTg1MzU1NX0.B4J7D4Iii5lpEE9NPI1t9BAdXzWaHmJY7touKd-usO4';

    async function loadVerificationDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedId = urlParams.get('r');

        if (!encodedId) {
            document.getElementById("loader").style.display = "none";
            alert('❌ د ستونزې تشخیص: په URL کې د "r" پارامتر شتون نه لري!');
            return;
        }

        try {
            let recordId;
            try {
                recordId = atob(encodedId);
            } catch (e) {
                document.getElementById("loader").style.display = "none";
                alert('❌ د ستونزې تشخیص: په URL کې ورکړل شوی "r" کوډ په سمه توګه Base64 ته انکوډ شوی نه دی!');
                return;
            }

            const response = await fetch(`${SUPABASE_URL}/rest/v1/visa_records1_new?id=eq.${recordId}&select=*`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });

            if (!response.ok) {
                document.getElementById("loader").style.display = "none";
                alert('❌ د Supabase ارتباط تېروتنه: ' + response.statusText);
                return;
            }

            const result = await response.json();

            if (!result || result.length === 0) {
                document.getElementById("loader").style.display = "none";
                alert('❌ د ستونزې تشخیص: د دې ID پر بنسټ په Supabase ډیټابیس کې ریکارډ ونه موندل شو!');
                return;
            }

            const data = result[0];

            function formatDate(dateString) {
                if (!dateString) return '';
                let d = new Date(dateString);
                if (isNaN(d)) return dateString;
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
            }

            document.getElementById('v_ref').innerText = data.visa_reference_number || '';
            document.getElementById('v_name').innerText = data.full_name || '';
            document.getElementById('v_passport').innerText = data.passport_no || '';
            document.getElementById('v_country').innerText = data.passport_country || '';
            document.getElementById('v_category').innerText = data.visa_category || '';
            document.getElementById('v_subcategory').innerText = data.visa_sub_category || '';
            document.getElementById('v_apptype').innerText = data.application_type || '';
            document.getElementById('v_facility').innerText = data.staying_facility || '';
            document.getElementById('v_duration').innerText = data.visa_duration || '';
            document.getElementById('v_start').innerText = formatDate(data.visa_start_date);
            document.getElementById('v_end').innerText = formatDate(data.visa_end_date);

            if (data.photo && data.photo.trim() !== "") {
                const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photo/${data.photo}`;
                let photoEl = document.getElementById('v_photo');
                photoEl.src = photoUrl;
                photoEl.style.display = "block";
            }

        } catch (err) {
            document.getElementById("loader").style.display = "none";
            alert('❌ جدي تخنیکي تېروتنه پیدا شوه: ' + err.message);
        } finally {
            document.getElementById("loader").style.display = "none";
        }
    }

    window.onload = loadVerificationDetails;
</script>
