<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delete Visa | Naqeeb System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<style>
    body { font-size: 15px; }
    .section-title {
        font-size: 13px;
        font-weight: 700;
        color: #dc2626;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid #dc2626;
        padding-bottom: 4px;
        margin-bottom: 12px;
    }
</style>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#0b6b3a',
            }
        }
    }
}
</script>
</head>
<body class="bg-gray-100 min-h-screen py-10 flex items-center justify-center">

<div class="container mx-auto px-4 max-w-lg">
    <div class="bg-white rounded-xl shadow-lg p-6 text-center">

        <div class="text-red-600 text-5xl mb-4">
            <i class="fa fa-exclamation-triangle"></i>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">Delete Visa Record</h2>
        <p class="text-gray-600 text-sm mb-6">Are you sure you want to delete this visa record? This action cannot be undone.</p>

        <div id="message-container"></div>

        <div id="recordInfo" class="bg-gray-50 p-4 rounded-lg text-left mb-6 border text-sm space-y-2">
            <p><strong>Reference:</strong> <span id="d_ref" class="text-gray-700">Loading...</span></p>
            <p><strong>Name:</strong> <span id="d_name" class="text-gray-700">Loading...</span></p>
            <p><strong>Passport No:</strong> <span id="d_passport" class="text-gray-700">Loading...</span></p>
        </div>

        <div class="flex gap-4">
            <button onclick="confirmDelete()" 
                    class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition text-base flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa fa-trash"></i> Yes, Delete
            </button>
            <a href="admin_dashboard.html" 
               class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2.5 rounded-lg transition text-base flex items-center justify-center gap-2 text-decoration-none">
                <i class="fa fa-arrow-left"></i> Cancel
            </a>
        </div>

    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bwciadrnuxjowqgaflgu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y2lhZHJudXhqb3dxZ2FmbGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzc1NTUsImV4cCI6MjEwMTg1MzU1NX0.B4J7D4Iii5lpEE9NPI1t9BAdXzWaHmJY7touKd-usO4';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const recordId = urlParams.get('id');

    async function fetchRecordDetails() {
        if (!recordId) {
            alert('Invalid Record ID');
            window.location.href = 'admin_dashboard.html';
            return;
        }

        const { data, error } = await supabaseClient
            .from('visa_records1_new')
            .select('visa_reference_number, full_name, passport_no')
            .eq('id', recordId)
            .single();

        if (error || !data) {
            alert('Record not found!');
            window.location.href = 'admin_dashboard.html';
            return;
        }

        document.getElementById('d_ref').innerText = data.visa_reference_number || '';
        document.getElementById('d_name').innerText = data.full_name || '';
        document.getElementById('d_passport').innerText = data.passport_no || '';
    }

    async function confirmDelete() {
        let messageContainer = document.getElementById('message-container');

        const { error } = await supabaseClient
            .from('visa_records1_new')
            .delete()
            .eq('id', recordId);

        if (error) {
            messageContainer.innerHTML = `<div class='bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4'>❌ Delete Error: ${error.message}</div>`;
        } else {
            messageContainer.innerHTML = `<div class='bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4'>✔ Visa Record Deleted Successfully!</div>`;
            setTimeout(() => {
                window.location.href = 'admin_dashboard.html';
            }, 1000);
        }
    }

    window.onload = fetchRecordDetails;
</script>

</body>
</html>
